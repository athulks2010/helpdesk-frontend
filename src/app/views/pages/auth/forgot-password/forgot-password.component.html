<div class="min-h-screen bg-gradient-to-br from-blue-50 via-indigo-50 to-slate-100 flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <a
        routerLink="/"
        class="inline-flex items-center justify-center gap-3 group transition-transform duration-200 hover:scale-105 mb-2 focus:outline-none"
        title="Back to HelpDesk Home"
      >
        <img
          src="/images/logo.png"
          alt="HelpDesk Logo"
          class="h-10 w-auto max-w-[200px] object-contain drop-shadow-sm"
          onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-flex';"
        />
        <div class="hidden items-center justify-center h-12 w-12 rounded-xl bg-blue-600 text-white font-bold text-xl shadow-lg">
          H
        </div>
      </a>
      <p class="mt-1 text-slate-600 text-sm font-medium">We'll email you a reset link</p>
    </div>

    <div class="bg-white/80 backdrop-blur-xl border border-white/20 rounded-2xl shadow-2xl overflow-hidden">
      <form [formGroup]="form" (ngSubmit)="submit()" class="px-8 py-8 space-y-4">
        <div *ngIf="error" class="rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm px-3 py-2">{{ error }}</div>
        <div *ngIf="success" class="rounded-lg bg-green-50 border border-green-200 text-green-700 text-sm px-3 py-2">{{ success }}</div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
          <input type="email" class="hd-input" formControlName="email" placeholder="you@example.com" />
        </div>

        <button type="submit" class="hd-btn-primary w-full" [disabled]="loading">
          {{ loading ? 'Sending…' : 'Send reset link' }}
        </button>

        <p class="text-center text-sm text-slate-600">
          <a routerLink="/auth/login" class="text-blue-600 font-medium">Back to sign in</a>
        </p>
      </form>
    </div>
  </div>
</div>
