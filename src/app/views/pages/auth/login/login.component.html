<div class="min-h-screen bg-gradient-to-br from-blue-50 via-indigo-50 to-slate-100 flex items-center justify-center p-4 relative overflow-hidden">
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -right-40 w-80 h-80 bg-gradient-to-br from-blue-400/20 to-indigo-400/20 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -left-40 w-80 h-80 bg-gradient-to-br from-slate-400/20 to-blue-400/20 rounded-full blur-3xl"></div>
  </div>
  <div class="relative w-full max-w-md">
    <div class="text-center mb-8">
      <a
        routerLink="/"
        class="inline-flex items-center justify-center gap-3 group transition-transform duration-200 hover:scale-105 mb-2 focus:outline-none"
        title="Back to HelpDesk Home"
      >
        <img
          src="/images/logo.png"
          alt="HelpDesk Logo"
          class="h-10 w-auto max-w-[200px] object-contain drop-shadow-sm"
          onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-flex';"
        />
        <div class="hidden items-center justify-center h-12 w-12 rounded-xl bg-blue-600 text-white font-bold text-xl shadow-lg">
          H
        </div>
      </a>
      <p class="mt-1 text-slate-600 text-sm font-medium">Welcome back! Please sign in to your account</p>
    </div>

    <div class="bg-white/80 backdrop-blur-xl border border-white/20 rounded-2xl shadow-2xl overflow-hidden">
      <div class="px-8 pt-8 pb-2">
        <h2 class="text-xl font-bold text-center text-slate-900 mb-1">Sign In</h2>
        <p class="text-center text-slate-600 text-sm">Enter your credentials to access your account</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" class="px-8 pb-8 pt-4 space-y-5">
        <div *ngIf="error" class="rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm px-3 py-2">
          {{ error }}
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
          <input type="email" formControlName="email" class="hd-input" placeholder="Enter your email" autocomplete="email" />
          <p *ngIf="form.get('email')?.touched && form.get('email')?.invalid" class="text-xs text-red-600 mt-1">Valid email is required</p>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
          <input type="password" formControlName="password" class="hd-input" placeholder="Enter your password" autocomplete="current-password" />
          <p *ngIf="form.get('password')?.touched && form.get('password')?.invalid" class="text-xs text-red-600 mt-1">Password is required</p>
        </div>

        <div class="flex items-center justify-between">
          <label class="flex items-center cursor-pointer gap-2 text-sm text-slate-700">
            <input type="checkbox" formControlName="remember" class="w-4 h-4 text-blue-600 border-slate-300 rounded" />
            Remember Me
          </label>
          <a routerLink="/auth/forgot-password" class="text-sm text-blue-600 hover:text-blue-700">Forgot Password?</a>
        </div>

        <button type="submit" class="hd-btn-primary w-full" [disabled]="loading">
          {{ loading ? 'Signing in…' : 'Sign In' }}
        </button>

        <p class="text-center text-sm text-slate-600">
          Don't have an account?
          <a routerLink="/auth/register" class="text-blue-600 hover:text-blue-700 font-medium">Register</a>
        </p>
      </form>
    </div>
  </div>
</div>
