<div class="space-y-6">

  <div *ngIf="loading" class="hd-card p-10 text-center text-slate-500">Loading…</div>

  <ng-container *ngIf="!loading">
    <div class="hd-card p-6 flex items-center justify-between gap-4">
      <div>
        <h2 class="text-lg font-semibold text-slate-900 dark:text-white">Status</h2>
        <p class="text-sm text-slate-500 mt-1">Current AI availability</p>
      </div>
      <div class="flex items-center gap-2">
        <span
          class="inline-block w-2.5 h-2.5 rounded-full"
          [class.bg-green-500]="status?.available || status?.feature_enabled"
          [class.bg-amber-500]="!(status?.available || status?.feature_enabled)"
        ></span>
        <span class="text-sm font-medium">
          {{ status?.available || status?.feature_enabled ? 'AI Active / Enabled' : 'AI Offline' }}
        </span>
      </div>
    </div>

    <div *ngIf="analyticsCards.length" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div *ngFor="let card of analyticsCards" class="hd-card p-5">
        <div class="text-xs uppercase tracking-wide text-slate-500">{{ card.label }}</div>
        <div class="mt-2 text-2xl font-bold text-slate-900 dark:text-white">{{ card.value }}</div>
      </div>
    </div>

    <form class="hd-card" [formGroup]="form" (ngSubmit)="save()">
      <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-700">
        <h2 class="text-lg font-semibold text-slate-900 dark:text-white">General AI Settings</h2>
        <p class="text-sm text-slate-500">Enable AI and configure model parameters</p>
      </div>
      <div class="p-6 grid grid-cols-1 sm:grid-cols-2 gap-5">
        <label class="flex items-center justify-between gap-3 p-4 border border-slate-200 rounded-xl cursor-pointer sm:col-span-2">
          <span class="text-sm font-semibold text-slate-900 dark:text-white">Enable AI Features</span>
          <input type="checkbox" class="w-4 h-4" formControlName="enabled" />
        </label>
        <div class="sm:col-span-2">
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">API Key</label>
          <input type="password" class="hd-input" formControlName="api_key" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Model</label>
          <input type="text" class="hd-input" formControlName="model" placeholder="gpt-3.5-turbo" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Temperature</label>
          <input type="number" class="hd-input" formControlName="temperature" min="0" max="2" step="0.1" />
        </div>
      </div>

      <div *ngIf="error" class="px-6 pb-2 text-sm text-red-600">{{ error }}</div>
      <div *ngIf="success" class="px-6 pb-2 text-sm text-green-600">{{ success }}</div>

      <div class="px-6 py-4 bg-slate-50 dark:bg-slate-900/40 border-t border-slate-200 dark:border-slate-700 flex justify-end">
        <button type="submit" class="hd-btn-primary" [disabled]="saving">
          {{ saving ? 'Saving…' : 'Save AI Settings' }}
        </button>
      </div>
    </form>
  </ng-container>
</div>
