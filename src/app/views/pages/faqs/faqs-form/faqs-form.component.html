<div class="space-y-6">

  <!-- Form Card (Design matching project standard) -->
  <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-sm overflow-hidden">

    <!-- Loading State -->
    <div *ngIf="loadingData" class="flex items-center justify-center gap-3 py-16 text-slate-400">
      <svg class="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
      </svg>
      <span class="text-sm">Loading FAQ data...</span>
    </div>

    <!-- Main Form -->
    <form *ngIf="!loadingData" [formGroup]="form" (ngSubmit)="submit()" novalidate>

      <!-- Error Alert -->
      <div *ngIf="error" class="flex items-center gap-3 mx-6 mt-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm">
        <svg class="w-5 h-5 text-red-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        {{ error }}
      </div>

      <div class="p-6 space-y-6">

        <!-- Row 1: Question / Title & Status -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
          <div class="md:col-span-2">
            <label class="form-label">
              {{ isEditMode ? 'FAQ Question / Title' : 'Question / Title' }} <span class="text-red-500">*</span>
            </label>
            <input type="text" formControlName="name" placeholder="e.g. How do I reset my password?"
              class="form-input"
              [class.border-red-400]="hasError('name')" />
            <p *ngIf="hasError('name')" class="form-error">Question / Title is required</p>
          </div>

          <div>
            <label class="form-label">Status</label>
            <div class="relative">
              <select formControlName="status" class="form-select pr-8">
                <option [ngValue]="1">Active</option>
                <option [ngValue]="0">Inactive</option>
              </select>
              <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3">
                <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                </svg>
              </div>
            </div>
          </div>
        </div>

        <!-- Row 2: FAQ Answer / Details -->
        <div>
          <label class="form-label">
            {{ isEditMode ? 'FAQ Answer' : 'Answer / Description' }} <span class="text-red-500">*</span>
          </label>
          <textarea formControlName="details" rows="6"
            placeholder="Provide a helpful and clear answer..."
            class="form-input resize-y min-h-[140px]"
            [class.border-red-400]="hasError('details')"></textarea>
          <p *ngIf="hasError('details')" class="form-error">Answer is required</p>
        </div>

      </div>

      <!-- Actions Footer -->
      <div class="px-6 py-4 bg-slate-50 dark:bg-slate-800/80 border-t border-slate-100 dark:border-slate-700 flex items-center justify-between gap-3">
        <div>
          <button *ngIf="isEditMode" type="button" (click)="remove()" [disabled]="deleting || loading"
            class="flex items-center gap-1.5 px-3.5 py-2 text-xs font-semibold text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-950/40 rounded-xl transition-colors border border-red-200 dark:border-red-900/50 disabled:opacity-50">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
            {{ deleting ? 'Deleting…' : 'Delete FAQ' }}
          </button>
        </div>

        <div class="flex items-center gap-2">
          <button type="button" (click)="cancel()"
            class="px-5 py-2.5 text-sm font-semibold text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-600 transition-colors">
            Cancel
          </button>
          <button type="submit" [disabled]="loading || deleting"
            class="flex items-center gap-2 px-6 py-2.5 text-sm font-bold text-white bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 rounded-xl shadow-lg shadow-blue-500/30 transition-all hover:scale-105 disabled:opacity-60 disabled:cursor-not-allowed disabled:hover:scale-100">
            <svg *ngIf="loading" class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            {{ loading ? 'Saving…' : (isEditMode ? 'Update FAQ' : 'Create FAQ') }}
          </button>
        </div>
      </div>

    </form>
  </div>
</div>
