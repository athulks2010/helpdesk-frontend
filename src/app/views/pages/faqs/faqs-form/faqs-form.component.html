<div class="bg-white dark:bg-slate-800 rounded-md shadow overflow-hidden max-w-full border border-slate-200 dark:border-slate-700">
  <div *ngIf="loadingData" class="p-10 text-center text-slate-500">Loading…</div>

  <form *ngIf="!loadingData" [formGroup]="form" (ngSubmit)="submit()">
    <div class="p-8 -mr-6 -mb-8 flex flex-wrap">
      <!-- Name -->
      <div class="pr-6 pb-8 w-full lg:w-1/2">
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Name</label>
        <input type="text" formControlName="name" placeholder=""
          class="w-full px-4 py-3 bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg text-sm text-slate-900 dark:text-white placeholder-slate-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200"
          [class.border-red-500]="hasError('name')" />
        <p *ngIf="hasError('name')" class="mt-1 text-xs text-red-600">Name is required</p>
      </div>

      <!-- Status -->
      <div class="pr-6 pb-8 w-full lg:w-1/2">
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Status</label>
        <div class="relative">
          <select formControlName="status"
            class="w-full px-4 py-3 pr-10 bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg text-sm text-slate-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 appearance-none cursor-pointer">
            <option [ngValue]="1">Active</option>
            <option [ngValue]="0">Inactive</option>
          </select>
          <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
          </div>
        </div>
      </div>

      <!-- Description -->
      <div class="pr-6 pb-8 w-full">
        <textarea formControlName="details" rows="6" placeholder="Faq Description"
          class="w-full px-4 py-3 bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg text-sm text-slate-900 dark:text-white placeholder-slate-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200 min-h-[140px] resize-y"
          [class.border-red-500]="hasError('details')"></textarea>
        <p *ngIf="hasError('details')" class="mt-1 text-xs text-red-600">Faq Description is required</p>
      </div>
    </div>

    <div *ngIf="error" class="px-8 pb-3 text-sm text-red-600">{{ error }}</div>

    <div class="px-8 py-4 bg-gray-50 dark:bg-slate-900/40 border-t border-gray-100 dark:border-slate-700 flex justify-end items-center">
      <button type="submit" [disabled]="loading"
        class="px-6 py-3 rounded bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white text-sm font-bold whitespace-nowrap shadow transition-colors disabled:opacity-50">
        {{ loading ? 'Saving…' : (isEditMode ? 'Update FAQ' : 'Create FAQ') }}
      </button>
    </div>
  </form>
</div>
