<div class="p-6 h-[calc(100vh-4rem)] flex flex-col">
  <div class="mb-4 flex items-center justify-between gap-4">
    <div>
      <h2 class="text-2xl font-bold text-slate-900">Chat</h2>
      <p class="text-sm text-slate-500 mt-1">Conversations with realtime updates</p>
    </div>
    <button type="button" class="hd-btn-secondary" (click)="load()">Refresh</button>
  </div>

  <div *ngIf="loading" class="hd-card p-8 text-center text-slate-500">Loading…</div>
  <div *ngIf="!loading && error" class="hd-card p-8 text-center text-red-600">{{ error }}</div>

  <div *ngIf="!loading && !error" class="flex-1 grid grid-cols-1 lg:grid-cols-3 gap-4 min-h-0">
    <div class="hd-card overflow-y-auto lg:col-span-1">
      <button
        type="button"
        *ngFor="let row of rows"
        class="w-full text-left px-4 py-3 border-b border-slate-100 hover:bg-slate-50"
        [class.bg-blue-50]="selected?.id === row.id"
        (click)="open(row)"
      >
        <div class="font-medium text-slate-900 truncate">{{ row.subject || ('Conversation #' + row.id) }}</div>
        <div class="text-xs text-slate-500 mt-1">{{ row.updated_at || '—' }}</div>
      </button>
      <div *ngIf="!rows.length" class="p-6 text-center text-slate-500 text-sm">No conversations</div>
    </div>

    <div class="hd-card lg:col-span-2 flex flex-col min-h-0">
      <div *ngIf="!selected" class="flex-1 flex items-center justify-center text-slate-500 text-sm">
        Select a conversation
      </div>
      <ng-container *ngIf="selected">
        <div class="px-4 py-3 border-b border-slate-100 font-semibold text-slate-900">
          {{ selected.subject || ('Conversation #' + selected.id) }}
        </div>
        <div class="flex-1 overflow-y-auto p-4 space-y-3">
          <div *ngIf="messagesLoading" class="text-sm text-slate-500">Loading messages…</div>
          <div *ngFor="let m of messages" class="max-w-[80%] rounded-xl px-3 py-2 text-sm bg-slate-100 text-slate-800">
            <div>{{ m.message || m.body || '—' }}</div>
            <div class="text-[10px] text-slate-400 mt-1">{{ m.created_at || '' }}</div>
          </div>
        </div>
        <div class="p-3 border-t border-slate-100 flex gap-2">
          <input
            class="hd-input flex-1"
            [(ngModel)]="draft"
            (keyup.enter)="send()"
            placeholder="Type a message…"
          />
          <button type="button" class="hd-btn-primary" (click)="send()">Send</button>
        </div>
      </ng-container>
    </div>
  </div>
</div>
