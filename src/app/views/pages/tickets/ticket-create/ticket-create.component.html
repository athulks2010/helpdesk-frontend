<div class="space-y-6">

  <!-- Form Card -->
  <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-sm overflow-hidden">

    <div *ngIf="loadingData" class="flex items-center justify-center gap-3 py-16 text-slate-400">
      <svg class="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
      </svg>
      <span class="text-sm">Loading ticket data...</span>
    </div>

    <form *ngIf="!loadingData" [formGroup]="form" (ngSubmit)="submit()" novalidate>

      <div *ngIf="error" class="flex items-center gap-3 mx-6 mt-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm">
        <svg class="w-5 h-5 text-red-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        {{ error }}
      </div>

      <div class="p-6 space-y-6">

        <!-- Create-only: Customer / Contact / Priority / Type -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5" *ngIf="!isEditMode">
          <div>
            <label class="form-label">Customer <span class="text-red-500">*</span></label>
            <select formControlName="user_id" class="form-select"
              [class.border-red-400]="f['user_id'].touched && f['user_id'].invalid">
              <option [ngValue]="0">— Select customer —</option>
              <option *ngFor="let c of customers" [ngValue]="+c.id">
                {{ displayName(c) }} ({{ c.email }})
              </option>
            </select>
            <p *ngIf="f['user_id'].touched && f['user_id'].invalid" class="form-error">Customer is required</p>
          </div>

          <!-- Contact field (commented out for now) -->
          <!--
          <div>
            <label class="form-label">Contact</label>
            <select formControlName="contact_id" class="form-select">
              <option [ngValue]="0">— None —</option>
              <option *ngFor="let c of contacts" [ngValue]="+c.id">{{ contactLabel(c) }}</option>
            </select>
          </div>
          -->

          <div>
            <label class="form-label">Priority <span class="text-red-500">*</span></label>
            <select formControlName="priority_id" class="form-select"
              [class.border-red-400]="f['priority_id'].touched && f['priority_id'].invalid">
              <option [ngValue]="0" disabled>— Select Priority —</option>
              <option *ngFor="let p of priorities" [ngValue]="+p.id">{{ p.name }}</option>
            </select>
            <p *ngIf="f['priority_id'].touched && f['priority_id'].invalid" class="form-error">Priority is required</p>
          </div>
        </div>

        <!-- Edit-only: Priority / Status / Assigned (matches /ticket/update) -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-5" *ngIf="isEditMode">
          <div>
            <label class="form-label">Priority</label>
            <select formControlName="priority_id" class="form-select">
              <option [ngValue]="0">— Select Priority —</option>
              <option *ngFor="let p of priorities" [ngValue]="+p.id">{{ p.name }}</option>
            </select>
          </div>
          <div>
            <label class="form-label">Status</label>
            <select formControlName="status_id" class="form-select">
              <option [ngValue]="0">— Select status —</option>
              <option *ngFor="let s of statuses" [ngValue]="+s.id">{{ s.name }}</option>
            </select>
          </div>
          <div>
            <label class="form-label">Assigned To</label>
            <select formControlName="assigned_to" class="form-select">
              <option [ngValue]="0">— Unassigned —</option>
              <option *ngFor="let a of assignees" [ngValue]="+a.id">
                {{ displayName(a) }} ({{ a.email }})
              </option>
            </select>
          </div>
        </div>

        <!-- Create-only taxonomy row -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5" *ngIf="!isEditMode">
          <div>
            <label class="form-label">Type</label>
            <select formControlName="type_id" class="form-select">
              <option [ngValue]="0">— Select Type —</option>
              <option *ngFor="let t of types" [ngValue]="+t.id">{{ t.name }}</option>
            </select>
          </div>
          <div>
            <label class="form-label">Department</label>
            <select formControlName="department_id" class="form-select">
              <option [ngValue]="0">— Select department —</option>
              <option *ngFor="let d of departments" [ngValue]="+d.id">{{ d.name }}</option>
            </select>
          </div>
          <!-- Category field (commented out for now) -->
          <!--
          <div>
            <label class="form-label">Category</label>
            <select formControlName="category_id" class="form-select">
              <option [ngValue]="0">— Select category —</option>
              <option *ngFor="let c of categories" [ngValue]="+c.id">{{ c.name }}</option>
            </select>
          </div>
          -->
        </div>

        <!-- Create-only: Status + Assignee -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5" *ngIf="!isEditMode">
          <div>
            <label class="form-label">Status</label>
            <select formControlName="status_id" class="form-select">
              <option [ngValue]="0">— Select status —</option>
              <option *ngFor="let s of statuses" [ngValue]="+s.id">{{ s.name }}</option>
            </select>
          </div>
          <div>
            <label class="form-label">Assigned To</label>
            <select formControlName="assigned_to" class="form-select">
              <option [ngValue]="0">— Unassigned —</option>
              <option *ngFor="let a of assignees" [ngValue]="+a.id">
                {{ displayName(a) }} ({{ a.email }})
              </option>
            </select>
          </div>
        </div>

        <div>
          <label class="form-label">Subject <span class="text-red-500">*</span></label>
          <input type="text" formControlName="subject" placeholder="Enter ticket subject"
            class="form-input"
            [class.border-red-400]="f['subject'].touched && f['subject'].invalid"/>
          <p *ngIf="f['subject'].touched && f['subject'].invalid" class="form-error">Subject is required</p>
        </div>

        <div>
          <label class="form-label">Request Details <span class="text-red-500">*</span></label>
          <textarea formControlName="body" rows="10"
            placeholder="Describe the issue in detail..."
            class="form-input font-mono resize-y min-h-[200px]"
            [class.border-red-400]="f['body'].touched && f['body'].invalid"></textarea>
          <p *ngIf="f['body'].touched && f['body'].invalid" class="form-error">Details are required</p>
        </div>

        <!-- Custom fields (ticket_fields → ticket_entries) -->
        <div *ngIf="customFieldDefs.length" formGroupName="custom_field" class="space-y-4">
          <h3 class="text-sm font-bold text-slate-800 dark:text-slate-100 border-b border-slate-200 dark:border-slate-700 pb-2">
            Custom Fields
          </h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div *ngFor="let field of customFieldDefs" [class.md:col-span-2]="field.type === 'textarea'">
              <label class="form-label">
                {{ field.label || field.name }}
                <span *ngIf="field.required === 1 || field.required === true" class="text-red-500">*</span>
              </label>

              <select *ngIf="field.type === 'select'" class="form-select" [formControlName]="field.name">
                <option value="">— Select —</option>
                <option *ngFor="let opt of fieldOptions(field)" [value]="opt">{{ opt }}</option>
              </select>

              <textarea *ngIf="field.type === 'textarea'" class="form-input resize-y min-h-[80px]" rows="3"
                [formControlName]="field.name" [placeholder]="field.placeholder || ''"></textarea>

              <label *ngIf="field.type === 'checkbox'" class="inline-flex items-center gap-2 text-sm text-slate-700 dark:text-slate-300">
                <input type="checkbox" class="rounded border-slate-300" [formControlName]="field.name" />
                {{ field.placeholder || field.label || field.name }}
              </label>

              <input *ngIf="field.type !== 'select' && field.type !== 'textarea' && field.type !== 'checkbox'"
                class="form-input"
                [type]="field.type === 'number' ? 'number' : field.type === 'email' ? 'email' : field.type === 'file' ? 'text' : 'text'"
                [formControlName]="field.name"
                [placeholder]="field.placeholder || ''" />

              <p *ngIf="field.hint" class="mt-1 text-xs text-slate-400">{{ field.hint }}</p>
            </div>
          </div>
        </div>

        <div *ngIf="!isEditMode">
          <div class="flex items-center gap-2 mb-3">
            <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/>
            </svg>
            <label class="form-label mb-0">Attach files <span class="text-slate-400 font-normal">(not sent with JSON create API)</span></label>
          </div>

          <label class="flex items-center gap-2 w-fit px-4 py-2.5 text-sm font-semibold text-slate-600 dark:text-slate-300 bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 border-dashed rounded-xl cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-600 transition-colors">
            <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
            </svg>
            Choose Files
            <input type="file" class="hidden" multiple accept=".xlsx,.xls,image/*,.doc,.docx,.ppt,.pptx,.txt,.pdf,.zip" (change)="onFileSelected($event)"/>
          </label>

          <div *ngIf="attachedFiles.length > 0" class="mt-3 space-y-2">
            <div *ngFor="let file of attachedFiles; let i = index"
              class="flex items-center justify-between px-4 py-2.5 bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl text-sm">
              <div class="flex items-center gap-2 min-w-0">
                <svg class="w-4 h-4 text-blue-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
                <span class="font-medium text-slate-700 dark:text-slate-200 truncate">{{ file.name }}</span>
                <span class="text-slate-400 text-xs flex-shrink-0">({{ fileSize(file.size) }})</span>
              </div>
              <button type="button" (click)="removeFile(i)"
                class="ml-2 text-xs font-semibold text-red-500 hover:text-red-700 transition-colors px-2 py-1 rounded hover:bg-red-50 dark:hover:bg-red-900/20 flex-shrink-0">
                Remove
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="px-6 py-4 bg-slate-50 dark:bg-slate-800/80 border-t border-slate-100 dark:border-slate-700 flex items-center justify-end gap-3">
        <a routerLink="/tickets" class="px-5 py-2.5 text-sm font-semibold text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-600 transition-colors">
          Cancel
        </a>
        <button type="submit" [disabled]="loading"
          class="flex items-center gap-2 px-6 py-2.5 text-sm font-bold text-white bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 rounded-xl shadow-lg shadow-blue-500/30 transition-all hover:scale-105 disabled:opacity-60 disabled:cursor-not-allowed disabled:hover:scale-100">
          <svg *ngIf="loading" class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          {{ loading ? (isEditMode ? 'Saving...' : 'Creating...') : (isEditMode ? 'Update Ticket' : 'Create Ticket') }}
        </button>
      </div>
    </form>
  </div>
</div>
