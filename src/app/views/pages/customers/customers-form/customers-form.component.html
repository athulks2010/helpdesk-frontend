<div class="space-y-6">

  <!-- Form Card (Design matching ticket-create) -->
  <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-sm overflow-hidden">

    <!-- Loading State -->
    <div *ngIf="loadingData" class="flex items-center justify-center gap-3 py-16 text-slate-400">
      <svg class="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
      </svg>
      <span class="text-sm">Loading customer data...</span>
    </div>

    <!-- Main Form -->
    <form *ngIf="!loadingData" [formGroup]="form" (ngSubmit)="submit()" novalidate>

      <!-- Error Alert -->
      <div *ngIf="error" class="flex items-center gap-3 mx-6 mt-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm">
        <svg class="w-5 h-5 text-red-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        {{ error }}
      </div>

      <div class="p-6 space-y-6">

        <!-- Row 1: First Name & Last Name -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div>
            <label class="form-label">First Name <span class="text-red-500">*</span></label>
            <input type="text" formControlName="first_name" placeholder="Enter first name"
              class="form-input"
              [class.border-red-400]="hasError('first_name')" />
            <p *ngIf="hasError('first_name')" class="form-error">First name is required</p>
          </div>

          <div>
            <label class="form-label">Last Name <span class="text-red-500">*</span></label>
            <input type="text" formControlName="last_name" placeholder="Enter last name"
              class="form-input"
              [class.border-red-400]="hasError('last_name')" />
            <p *ngIf="hasError('last_name')" class="form-error">Last name is required</p>
          </div>
        </div>

        <!-- Row 2: Email & Phone -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div>
            <label class="form-label">Email <span class="text-red-500">*</span></label>
            <input type="email" formControlName="email" placeholder="Enter email address"
              class="form-input"
              [class.border-red-400]="hasError('email')" />
            <p *ngIf="hasError('email')" class="form-error">Email is required</p>
          </div>

          <div>
            <label class="form-label">Phone</label>
            <input type="text" formControlName="phone" placeholder="Enter phone number"
              class="form-input" />
          </div>
        </div>

        <!-- Row 3: Address (textarea) -->
        <div>
          <label class="form-label">Address</label>
          <textarea formControlName="address" rows="3" placeholder="Enter street address, suite, unit, etc."
            class="form-input resize-y"></textarea>
        </div>

        <!-- Row 4: Country, then City (In requested order) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div>
            <label class="form-label">Country</label>
            <input type="text" formControlName="country" placeholder="Enter country"
              class="form-input" />
          </div>

          <div>
            <label class="form-label">City</label>
            <input type="text" formControlName="city" placeholder="Enter city"
              class="form-input" />
          </div>
        </div>

        <!-- Row 4: Password -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div>
            <label class="form-label">
              Password <span *ngIf="!isEditMode" class="text-red-500">*</span>
            </label>
            <div class="relative">
              <input [type]="showPassword ? 'text' : 'password'" formControlName="password"
                placeholder="Enter password"
                class="form-input pr-10"
                [class.border-red-400]="hasError('password')" />
              <button type="button"
                class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors"
                (click)="showPassword = !showPassword">
                <svg *ngIf="!showPassword" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
                <svg *ngIf="showPassword" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                </svg>
              </button>
            </div>
            <p *ngIf="hasError('password')" class="form-error">Password is required</p>
            <p *ngIf="isEditMode" class="text-xs text-slate-400 mt-1">Leave blank to keep current password</p>
          </div>
        </div>

        <!-- Row 5: Photo Upload (Matching ticket file upload design) -->
        <div>
          <label class="form-label">Photo</label>
          <div class="flex items-center gap-4">
            <div *ngIf="form.get('photo_path')?.value" class="shrink-0">
              <img [src]="getPhotoUrl()" alt="Preview"
                class="h-16 w-16 object-cover rounded-xl shadow-sm border border-slate-200 dark:border-slate-700" />
            </div>
            <div class="flex items-center gap-3">
              <label
                class="flex items-center gap-2 px-4 py-2.5 text-sm font-semibold text-slate-600 dark:text-slate-300 bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 border-dashed rounded-xl cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-600 transition-colors">
                <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
                </svg>
                Choose Photo
                <input type="file" class="hidden" (change)="onFileSelected($event)" accept="image/*" />
              </label>
              <span *ngIf="getFileName()" class="text-xs text-slate-500 dark:text-slate-400 truncate max-w-xs font-medium">{{ getFileName() }}</span>
            </div>
          </div>
        </div>

      </div>

      <!-- Form Footer (Matching ticket-create buttons) -->
      <div class="px-6 py-4 bg-slate-50 dark:bg-slate-800/80 border-t border-slate-100 dark:border-slate-700 flex items-center justify-end gap-3">
        <!-- View Tickets link in Edit Mode -->
        <button *ngIf="isEditMode" type="button" (click)="goToTickets()"
          class="mr-auto inline-flex items-center gap-2 px-4 py-2 text-sm font-semibold text-slate-600 dark:text-slate-300 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 rounded-xl transition-colors">
          <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/>
          </svg>
          View Tickets
        </button>

        <button type="button" (click)="cancel()"
          class="px-5 py-2.5 text-sm font-semibold text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-600 transition-colors">
          Cancel
        </button>
        <button type="submit" [disabled]="loading"
          class="flex items-center gap-2 px-6 py-2.5 text-sm font-bold text-white bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 rounded-xl shadow-lg shadow-blue-500/30 transition-all hover:scale-105 disabled:opacity-60 disabled:cursor-not-allowed disabled:hover:scale-100">
          <svg *ngIf="loading" class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          {{ loading ? (isEditMode ? 'Saving...' : 'Creating...') : (isEditMode ? 'Update Customer' : 'Create Customer') }}
        </button>
      </div>

    </form>
  </div>
</div>
