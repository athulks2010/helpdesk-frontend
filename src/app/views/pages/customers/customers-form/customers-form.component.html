<div class="space-y-6">
  <div *ngIf="loadingData" class="hd-card p-10 text-center text-slate-500">Loading…</div>

  <form *ngIf="!loadingData" class="hd-card" [formGroup]="form" (ngSubmit)="submit()">
    <div class="p-6 grid grid-cols-1 sm:grid-cols-6 gap-5">
      <!-- Row 1 -->
      <div class="sm:col-span-2">
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">First name</label>
        <input type="text" class="hd-input" formControlName="first_name" />
        <p *ngIf="hasError('first_name')" class="mt-1 text-xs text-red-600">{{ 'First Name' }} is required</p>
      </div>

      <div class="sm:col-span-2">
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Last name</label>
        <input type="text" class="hd-input" formControlName="last_name" />
        <p *ngIf="hasError('last_name')" class="mt-1 text-xs text-red-600">{{ 'Last Name' }} is required</p>
      </div>

      <div class="sm:col-span-2">
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Email</label>
        <input type="email" class="hd-input" formControlName="email" />
        <p *ngIf="hasError('email')" class="mt-1 text-xs text-red-600">{{ 'Email' }} is required</p>
      </div>

      <!-- Row 2 -->
      <div class="sm:col-span-3">
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Phone</label>
        <input type="text" class="hd-input" formControlName="phone" />
      </div>

      <div class="sm:col-span-3">
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">City</label>
        <input type="text" class="hd-input" formControlName="city" />
      </div>

      <!-- Row 3 -->
      <div class="sm:col-span-2">
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Address</label>
        <input type="text" class="hd-input" formControlName="address" />
      </div>

      <div class="sm:col-span-2">
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Country</label>
        <select class="hd-input" formControlName="country">
          <option value="">Select country...</option>
          <option value="US">United States</option>
          <option value="UK">United Kingdom</option>
          <option value="CA">Canada</option>
          <option value="IN">India</option>
          <option value="AU">Australia</option>
        </select>
      </div>

      <div class="sm:col-span-2">
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Password</label>
        <div class="relative">
          <input [type]="showPassword ? 'text' : 'password'" class="hd-input pr-10" formControlName="password" />
          <button type="button"
            class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600"
            (click)="showPassword = !showPassword">
            <svg *ngIf="!showPassword" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            <svg *ngIf="showPassword" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
            </svg>
          </button>
        </div>
        <p *ngIf="hasError('password')" class="mt-1 text-xs text-red-600">{{ 'Password' }} is required</p>
      </div>

      <!-- Row 4 -->
      <div class="sm:col-span-6">
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Photo</label>
        <div class="flex items-center gap-4">
          <div *ngIf="isEditMode && form.get('photo_path')?.value" class="shrink-0">
            <img [src]="getPhotoUrl()" alt="Preview"
              class="h-16 w-16 object-cover rounded shadow-sm border border-slate-200" />
          </div>
          <div class="flex items-center flex-1">
            <label
              class="cursor-pointer hd-btn-secondary !rounded-r-none !py-2 !px-4 text-sm whitespace-nowrap bg-slate-100 hover:bg-slate-200 border-r-0">
              Browse
              <input type="file" class="hidden" (change)="onFileSelected($event)" accept="image/*" />
            </label>
            <input type="text" class="hd-input !rounded-l-none" readonly [value]="getFileName()" placeholder="" />
          </div>
        </div>
      </div>
    </div>

    <div *ngIf="error" class="px-6 pb-2 text-sm text-red-600">{{ error }}</div>

    <div
      class="px-6 py-4 bg-slate-50 dark:bg-slate-900/40 border-t border-slate-200 dark:border-slate-700 flex justify-end gap-2">

      <button type="submit" class="hd-btn-primary" [disabled]="loading">
        {{ loading ? 'Saving…' : (isEditMode ? 'Update Customer' : 'Create') }}
      </button>
    </div>
  </form>
</div>
