<div class="space-y-6">

  <!-- Form Card (Design matching ticket-create and customers-form) -->
  <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-sm overflow-hidden">

    <!-- Loading State -->
    <div *ngIf="loadingData" class="flex items-center justify-center gap-3 py-16 text-slate-400">
      <svg class="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
      </svg>
      <span class="text-sm">Loading organization data...</span>
    </div>

    <!-- Main Form -->
    <form *ngIf="!loadingData" [formGroup]="form" (ngSubmit)="submit()" novalidate>

      <!-- Error Alert -->
      <div *ngIf="error" class="flex items-center gap-3 mx-6 mt-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm">
        <svg class="w-5 h-5 text-red-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        {{ error }}
      </div>

      <div class="p-6 space-y-6">

        <!-- Row 1: Name & Email -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div>
            <label class="form-label">Organization Name <span class="text-red-500">*</span></label>
            <input type="text" formControlName="name" placeholder="Enter organization / company name"
              class="form-input"
              [class.border-red-400]="hasError('name')" />
            <p *ngIf="hasError('name')" class="form-error">Organization name is required</p>
          </div>

          <div>
            <label class="form-label">Email</label>
            <input type="email" formControlName="email" placeholder="Enter primary contact email"
              class="form-input" />
          </div>
        </div>

        <!-- Row 2: Phone & Region -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div>
            <label class="form-label">Phone</label>
            <input type="text" formControlName="phone" placeholder="Enter telephone or mobile number"
              class="form-input" />
          </div>

          <div>
            <label class="form-label">Region / State</label>
            <input type="text" formControlName="region" placeholder="Enter state, province or region"
              class="form-input" />
          </div>
        </div>

        <!-- Row 3: Address (textarea) -->
        <div>
          <label class="form-label">Address</label>
          <textarea formControlName="address" rows="3" placeholder="Enter company headquarters, street address, suite, etc."
            class="form-input resize-y"></textarea>
        </div>

        <!-- Row 4: Country, then City (In requested order: Address, Country, City) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div>
            <label class="form-label">Country</label>
            <div class="relative">
              <select formControlName="country" class="form-select pr-8">
                <option [ngValue]="null">— Select Country —</option>
                <option *ngFor="let c of countries" [ngValue]="c.id">{{ c.name }}</option>
              </select>
              <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3">
                <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                </svg>
              </div>
            </div>
          </div>

          <div>
            <label class="form-label">City</label>
            <input type="text" formControlName="city" placeholder="Enter city"
              class="form-input" />
          </div>
        </div>

        <!-- Row 5: Postal Code -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div>
            <label class="form-label">Postal / ZIP Code</label>
            <input type="text" formControlName="postal_code" placeholder="Enter ZIP or postal code"
              class="form-input" />
          </div>
        </div>

      </div>

      <!-- Form Footer (Matching ticket-create and users-form) -->
      <div class="px-6 py-4 bg-slate-50 dark:bg-slate-800/80 border-t border-slate-100 dark:border-slate-700 flex items-center justify-end gap-3">
        <button type="button" (click)="cancel()"
          class="px-5 py-2.5 text-sm font-semibold text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-600 transition-colors">
          Cancel
        </button>
        <button type="submit" [disabled]="loading"
          class="flex items-center gap-2 px-6 py-2.5 text-sm font-bold text-white bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 rounded-xl shadow-lg shadow-blue-500/30 transition-all hover:scale-105 disabled:opacity-60 disabled:cursor-not-allowed disabled:hover:scale-100">
          <svg *ngIf="loading" class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          {{ loading ? (isEditMode ? 'Saving...' : 'Creating...') : (isEditMode ? 'Update Organization' : 'Create Organization') }}
        </button>
      </div>

    </form>
  </div>
</div>
