<div class="space-y-6">
  <div class="flex items-center justify-end gap-2">
      <button type="button" class="hd-btn-secondary" (click)="load()">Refresh</button>
      <button type="button" class="hd-btn-primary" (click)="createNew()">
        <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
        </svg>
        Create Blog Post
      </button>
  </div>

  <div class="hd-card p-4">
    <div class="flex flex-col sm:flex-row sm:items-center gap-3">
      <div class="relative flex-1">
        <input type="search" class="hd-input pl-10" placeholder="Search blog posts..." [(ngModel)]="search"
          (ngModelChange)="onSearchChange()" />
        <svg class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor"
          viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </div>
      <div class="text-sm text-slate-500 whitespace-nowrap">
        Total: {{ rows.length }} · Showing: {{ filtered.length }}
      </div>
    </div>
  </div>

  <div *ngIf="loading" class="hd-card p-10 text-center text-slate-500">
    <div class="inline-block w-8 h-8 border-2 border-blue-600 border-t-transparent rounded-full animate-spin mb-3">
    </div>
    <p>Loading blog posts…</p>
  </div>

  <div *ngIf="!loading && error" class="hd-card p-8 text-center text-red-600">{{ error }}</div>

  <div *ngIf="!loading && !error" class="hd-table-wrap">
    <div class="overflow-x-auto">
      <table class="hd-table">
        <thead>
          <tr>
            <th>POST</th>
            <th>TYPE</th>
            <th>STATUS</th>
            <th>CREATED</th>
            <th class="text-right">ACTIONS</th>
          </tr>
        </thead>
        <tbody class="bg-white dark:bg-slate-800 divide-y divide-slate-200 dark:divide-slate-700">
          <tr *ngFor="let row of filtered">
            <td>{{ cell(row, 'title') || '—' }}</td>
            <td>{{ cell(row, 'type.name') || '—' }}</td>
            <td>{{ formatDate(cell(row, 'created_at')) }}</td>
            <td class="text-right whitespace-nowrap">
              <div class="inline-flex items-center gap-5">
                <button type="button"
                  class="inline-flex items-center gap-1.5 text-slate-700 hover:text-slate-900 dark:text-slate-300 dark:hover:text-white text-sm font-medium"
                  (click)="edit(row)">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                      d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zM16.862 4.487L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" />
                  </svg>
                  Edit
                </button>
                <button type="button"
                  class="inline-flex items-center gap-1.5 text-red-500 hover:text-red-600 dark:text-red-400 dark:hover:text-red-300 text-sm font-medium disabled:opacity-50"
                  [disabled]="deletingId === (row.id || row._id)" (click)="remove(row)">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                      d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                  </svg>
                  Delete
                </button>
              </div>
            </td>
          </tr>
          <tr *ngIf="!filtered.length">
            <td colspan="4" class="px-4 py-10 text-center text-slate-500">
              No blog posts found. Create one to get started.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
