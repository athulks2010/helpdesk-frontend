<div class="space-y-6">
  <div *ngIf="loadingData" class="hd-card p-10 text-center text-slate-500">Loading…</div>

  <form *ngIf="!loadingData" class="hd-card" [formGroup]="form" (ngSubmit)="submit()">
    <div class="p-6 grid grid-cols-1 gap-5 max-w-2xl">
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Label</label>
        <input type="text" class="hd-input" formControlName="label" />
        <p *ngIf="hasError('label')" class="mt-1 text-xs text-red-600">Label is required</p>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Location</label>
        <select class="hd-input" formControlName="location">
          <option *ngFor="let opt of locations" [ngValue]="opt.value">{{ opt.label }}</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Internal route
          (recommended)</label>
        <select class="hd-input" formControlName="url" (change)="onRouteChange()">
          <option *ngFor="let opt of routes" [ngValue]="opt.value">{{ opt.label }}</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">External URL</label>
        <input type="url" class="hd-input" formControlName="external_url" placeholder="https://example.com"
          (input)="onExternalChange()" />
        <p class="mt-1 text-xs text-slate-500">Use this for links outside the app. If filled, it is used instead of the
          internal route.</p>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Icon name</label>
        <input type="text" class="hd-input" formControlName="icon" placeholder="home" />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Active state key</label>
        <input type="text" class="hd-input" formControlName="active_key" placeholder="home" />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Show only when feature is
          enabled</label>
        <select class="hd-input" formControlName="feature">
          <option *ngFor="let opt of features" [ngValue]="opt.value">{{ opt.label }}</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Link target</label>
        <select class="hd-input" formControlName="target">
          <option *ngFor="let opt of targets" [ngValue]="opt.value">{{ opt.label }}</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Sort order</label>
        <input type="number" class="hd-input" formControlName="order" />
      </div>

      <label class="flex items-center gap-2 cursor-pointer select-none">
        <input type="checkbox" class="w-4 h-4 rounded border-slate-300 text-blue-600" formControlName="is_active" />
        <span class="text-sm font-medium text-slate-700 dark:text-slate-300">Active</span>
      </label>
    </div>

    <div *ngIf="error" class="px-6 pb-2 text-sm text-red-600">{{ error }}</div>

    <div
      class="px-6 py-4 bg-slate-50 dark:bg-slate-900/40 border-t border-slate-200 dark:border-slate-700 flex justify-end gap-2">
      <button type="button" class="hd-btn-secondary" (click)="cancel()" [disabled]="loading">Cancel</button>
      <button type="submit" class="hd-btn-primary" [disabled]="loading">
        {{ loading ? 'Saving…' : (isEditMode ? 'Update Menu' : 'Create') }}
      </button>
    </div>
  </form>
</div>
