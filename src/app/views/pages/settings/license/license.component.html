<div class="space-y-6">
  <div>
    <p class="text-sm text-slate-500 dark:text-slate-400">
      System registration and software license verification details.
    </p>
  </div>

  <div *ngIf="loading" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-sm p-16 text-center text-slate-400 flex items-center justify-center gap-3">
    <svg class="animate-spin w-5 h-5 text-blue-600" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
    </svg>
    <span class="text-sm">Loading license information…</span>
  </div>

  <div *ngIf="error" class="flex items-center gap-3 p-4 rounded-xl bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-400 text-sm">
    <svg class="w-5 h-5 text-red-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>
    {{ error }}
  </div>

  <form *ngIf="!loading" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-sm overflow-hidden" [formGroup]="form">
    <div class="px-6 py-4 border-b border-slate-100 dark:border-slate-700/60 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <span class="w-8 h-8 rounded-xl bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 flex items-center justify-center shadow-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
          </svg>
        </span>
        <h3 class="text-sm font-bold text-slate-900 dark:text-white">License Details</h3>
      </div>
      <span class="inline-flex items-center gap-1 text-xs font-semibold text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/40 px-2.5 py-1 rounded-lg">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
        Active License
      </span>
    </div>

    <div class="p-6 grid grid-cols-1 sm:grid-cols-2 gap-5">
      <div class="sm:col-span-2">
        <label class="form-label">License Key</label>
        <input type="text" class="form-input font-mono text-xs bg-slate-50 dark:bg-slate-900/50" formControlName="license_key" readonly />
      </div>
      <div>
        <label class="form-label">Status</label>
        <input type="text" class="form-input bg-slate-50 dark:bg-slate-900/50" formControlName="license_status" readonly />
      </div>
      <div>
        <label class="form-label">Expires</label>
        <input type="text" class="form-input bg-slate-50 dark:bg-slate-900/50" formControlName="expires_at" readonly />
      </div>
      <div class="sm:col-span-2">
        <label class="form-label">Licensed To</label>
        <input type="text" class="form-input bg-slate-50 dark:bg-slate-900/50" formControlName="licensed_to" readonly />
      </div>
    </div>

    <div class="px-6 py-4 bg-slate-50/80 dark:bg-slate-800/80 border-t border-slate-100 dark:border-slate-700 text-xs text-slate-500 dark:text-slate-400 flex items-center gap-2">
      <svg class="w-4 h-4 text-slate-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      This is a read-only license display. License activation and renewal are managed by your host installation.
    </div>
  </form>
</div>
