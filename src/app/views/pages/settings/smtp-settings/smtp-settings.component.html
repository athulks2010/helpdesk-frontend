<div class="space-y-6 max-w-4xl">
  <div class="flex items-start justify-between gap-4">
    <div>
      <h1 class="text-2xl font-extrabold text-slate-900 dark:text-white tracking-tight">SMTP Settings</h1>
      <p class="text-sm text-slate-500 mt-0.5">Configure your email server for notifications</p>
    </div>
    <button type="button" class="hd-btn-secondary" (click)="test()" [disabled]="testing || loading">
      {{ testing ? 'Testing…' : 'Test Connection' }}
    </button>
  </div>

  <div *ngIf="loading" class="hd-card p-10 text-center text-slate-500">Loading…</div>

  <form *ngIf="!loading" class="hd-card" [formGroup]="form" (ngSubmit)="save()">
    <div class="p-6 grid grid-cols-1 sm:grid-cols-2 gap-5">
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">SMTP Host</label>
        <input type="text" class="hd-input" formControlName="host" placeholder="smtp.gmail.com" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Port</label>
        <input type="number" class="hd-input" formControlName="port" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Username</label>
        <input type="text" class="hd-input" formControlName="username" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Password</label>
        <input type="password" class="hd-input" formControlName="password" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Encryption</label>
        <select class="hd-input" formControlName="encryption">
          <option value="none">None</option>
          <option value="tls">TLS</option>
          <option value="ssl">SSL</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">From Address</label>
        <input type="email" class="hd-input" formControlName="from_address" />
      </div>
      <div class="sm:col-span-2">
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">From Name</label>
        <input type="text" class="hd-input" formControlName="from_name" />
      </div>
    </div>

    <div *ngIf="testResult" class="px-6 pb-2">
      <div
        class="p-3 rounded-lg text-sm border"
        [class.bg-green-50]="testResult.success"
        [class.border-green-200]="testResult.success"
        [class.text-green-800]="testResult.success"
        [class.bg-red-50]="!testResult.success"
        [class.border-red-200]="!testResult.success"
        [class.text-red-800]="!testResult.success"
      >
        {{ testResult.message }}
      </div>
    </div>

    <div *ngIf="error" class="px-6 pb-2 text-sm text-red-600">{{ error }}</div>
    <div *ngIf="success" class="px-6 pb-2 text-sm text-green-600">{{ success }}</div>

    <div class="px-6 py-4 bg-slate-50 dark:bg-slate-900/40 border-t border-slate-200 dark:border-slate-700 flex justify-end gap-2">
      <button type="submit" class="hd-btn-primary" [disabled]="saving">
        {{ saving ? 'Saving…' : 'Save Settings' }}
      </button>
    </div>
  </form>
</div>
