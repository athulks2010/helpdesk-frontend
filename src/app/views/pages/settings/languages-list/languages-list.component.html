<div class="space-y-6">
  <div class="flex items-center justify-end gap-2">
    <button type="button" class="hd-btn-secondary" (click)="load()">Refresh</button>
    <button type="button" class="hd-btn-primary" (click)="createNew()">
      <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
      </svg>
      Add Language
    </button>
  </div>

  <div *ngIf="loading" class="hd-card p-8 text-center text-slate-500">Loading…</div>
  <div *ngIf="error" class="text-sm text-red-600">{{ error }}</div>

  <div *ngIf="!loading" class="hd-table-wrap">
    <table class="hd-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Code</th>
          <th>Status</th>
          <th class="text-right">Actions</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-slate-200">
        <tr *ngFor="let row of rows">
          <td>{{ row.name || '—' }}</td>
          <td>{{ row.code || '—' }}</td>
          <td>
            <span
              class="inline-flex items-center px-2.5 py-0.5 rounded text-xs font-medium text-white"
              [ngClass]="(row.status === 0 || row.status === false || row.status === '0') ? 'bg-red-600' : 'bg-green-600'"
            >
              {{ (row.status === 0 || row.status === false || row.status === '0') ? 'Inactive' : 'Active' }}
            </span>
          </td>
          <td class="text-right">
            <div class="hd-actions">
              <button type="button" class="text-blue-600 hover:text-blue-800 text-sm font-medium" (click)="edit(row)">Edit</button>
              <button type="button" class="text-red-600 hover:text-red-800 text-sm font-medium" (click)="remove(row)">Delete</button>
            </div>
          </td>
        </tr>
        <tr *ngIf="!rows.length">
          <td colspan="4" class="px-4 py-8 text-center text-slate-500">No languages found</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
