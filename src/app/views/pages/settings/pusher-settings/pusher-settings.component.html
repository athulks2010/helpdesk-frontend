<div class="space-y-6">
  <div class="flex items-center justify-end gap-2">
    <button type="button" class="hd-btn-secondary" (click)="test()" [disabled]="testing || loading">
      {{ testing ? 'Testing…' : 'Test Connection' }}
    </button>
  </div>

  <div *ngIf="loading" class="hd-card p-10 text-center text-slate-500">Loading…</div>

  <form *ngIf="!loading" class="hd-card" [formGroup]="form" (ngSubmit)="save()">
    <div class="p-6 grid grid-cols-1 sm:grid-cols-2 gap-5">
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">App ID</label>
        <input type="text" class="hd-input" formControlName="app_id" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Key</label>
        <input type="text" class="hd-input" formControlName="key" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Secret</label>
        <input type="password" class="hd-input" formControlName="secret" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Cluster</label>
        <input type="text" class="hd-input" formControlName="cluster" placeholder="mt1" />
      </div>
    </div>

    <div *ngIf="testResult" class="px-6 pb-2">
      <div
        class="p-3 rounded-lg text-sm border"
        [class.bg-green-50]="testResult.success"
        [class.border-green-200]="testResult.success"
        [class.text-green-800]="testResult.success"
        [class.bg-red-50]="!testResult.success"
        [class.border-red-200]="!testResult.success"
        [class.text-red-800]="!testResult.success"
      >
        {{ testResult.message }}
      </div>
    </div>

    <div *ngIf="error" class="px-6 pb-2 text-sm text-red-600">{{ error }}</div>
    <div *ngIf="success" class="px-6 pb-2 text-sm text-green-600">{{ success }}</div>

    <div class="px-6 py-4 bg-slate-50 dark:bg-slate-900/40 border-t border-slate-200 dark:border-slate-700 flex justify-end">
      <button type="submit" class="hd-btn-primary" [disabled]="saving">
        {{ saving ? 'Saving…' : 'Save Settings' }}
      </button>
    </div>
  </form>
</div>
