<div class="space-y-6 max-w-4xl">
  <div class="flex items-start justify-between gap-4">
    <div>
      <h1 class="text-2xl font-extrabold text-slate-900 dark:text-white tracking-tight">Edit {{ templateName }}</h1>
      <p class="text-sm text-slate-500 mt-0.5">Update email subject and body</p>
    </div>
    <button type="button" class="hd-btn-secondary" (click)="cancel()">Back</button>
  </div>

  <div *ngIf="loading" class="hd-card p-10 text-center text-slate-500">Loading…</div>

  <form *ngIf="!loading" class="hd-card" [formGroup]="form" (ngSubmit)="save()">
    <div class="p-6 space-y-5">
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Subject</label>
        <input type="text" class="hd-input" formControlName="subject" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Body</label>
        <textarea class="hd-input min-h-[280px] font-mono text-sm" formControlName="body" rows="14"></textarea>
      </div>
    </div>

    <div *ngIf="error" class="px-6 pb-2 text-sm text-red-600">{{ error }}</div>

    <div class="px-6 py-4 bg-slate-50 dark:bg-slate-900/40 border-t border-slate-200 dark:border-slate-700 flex justify-end gap-2">
      <button type="button" class="hd-btn-secondary" (click)="cancel()" [disabled]="saving">Cancel</button>
      <button type="submit" class="hd-btn-primary" [disabled]="saving">
        {{ saving ? 'Saving…' : 'Update Template' }}
      </button>
    </div>
  </form>
</div>
