<div class="space-y-6">
  <div *ngIf="loading" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-sm p-16 text-center text-slate-400 flex items-center justify-center gap-3">
    <svg class="animate-spin w-5 h-5 text-blue-600" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
    </svg>
    <span class="text-sm">Loading email template…</span>
  </div>

  <form *ngIf="!loading" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-sm overflow-hidden" [formGroup]="form" (ngSubmit)="save()">
    <div class="px-6 py-4 border-b border-slate-100 dark:border-slate-700/60">
      <h3 class="text-base font-bold text-slate-900 dark:text-white">Edit Email Template</h3>
      <p class="text-xs text-slate-500 dark:text-slate-400">Modify email subject line and HTML body content</p>
    </div>

    <div class="p-6 space-y-5">
      <div>
        <label class="form-label">Subject</label>
        <input type="text" class="form-input" formControlName="subject" placeholder="Email subject" />
      </div>
      <div>
        <label class="form-label">Body Content</label>
        <textarea class="form-input min-h-[280px] font-mono text-xs leading-relaxed" formControlName="body" rows="14" placeholder="Enter template HTML/text content..."></textarea>
      </div>
    </div>

    <div *ngIf="error" class="px-6 pb-4">
      <div class="flex items-center gap-3 p-4 rounded-xl bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-400 text-sm">
        <svg class="w-5 h-5 text-red-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        {{ error }}
      </div>
    </div>

    <div class="px-6 py-4 bg-slate-50/80 dark:bg-slate-800/80 border-t border-slate-100 dark:border-slate-700 flex items-center justify-end gap-3">
      <button type="button" class="px-5 py-2.5 text-sm font-semibold text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-600 transition-colors shadow-sm" (click)="cancel()" [disabled]="saving">Cancel</button>
      <button type="submit" class="flex items-center gap-2 px-6 py-2.5 text-sm font-bold text-white bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 rounded-xl shadow-lg shadow-blue-500/30 transition-all hover:scale-105 disabled:opacity-60 disabled:cursor-not-allowed disabled:hover:scale-100" [disabled]="saving">
        <svg *ngIf="saving" class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
        <svg *ngIf="!saving" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/>
        </svg>
        {{ saving ? 'Saving…' : 'Update Template' }}
      </button>
    </div>
  </form>
</div>
