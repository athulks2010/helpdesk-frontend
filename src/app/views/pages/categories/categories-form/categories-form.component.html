<div class="space-y-6">
  <div *ngIf="loadingData" class="hd-card p-10 text-center text-slate-500">Loading…</div>

  <form *ngIf="!loadingData" class="hd-card" [formGroup]="form" (ngSubmit)="submit()">
    <div class="p-6 grid grid-cols-1 sm:grid-cols-2 gap-5">
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Department</label>
        <select class="hd-input" formControlName="department_id">
          <option [ngValue]="null">None</option>
          <option *ngFor="let opt of departments" [ngValue]="opt.id || opt._id">{{ opt.name }}</option>
        </select>

      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Parent Category</label>
        <select class="hd-input" formControlName="parent_id">
          <option [ngValue]="null">None</option>
          <option *ngFor="let opt of parents" [ngValue]="opt.id || opt._id">{{ opt.name }}</option>
        </select>

      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Name</label>
        <input type="text" class="hd-input" formControlName="name" />
        <p *ngIf="hasError('name')" class="mt-1 text-xs text-red-600">Name is required</p>
      </div>

      <div *ngIf="isEditMode">
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Color</label>
        <div class="flex items-center gap-3">
          <input type="color" class="h-10 w-14 rounded border border-slate-300 cursor-pointer" formControlName="color" />
          <input type="text" class="hd-input" formControlName="color" placeholder="#3b82f6" />
        </div>
      </div>
    </div>

    <div *ngIf="error" class="px-6 pb-2 text-sm text-red-600">{{ error }}</div>

    <div class="px-6 py-4 bg-slate-50 dark:bg-slate-900/40 border-t border-slate-200 dark:border-slate-700 flex justify-end gap-2">
      <button type="button" class="hd-btn-secondary" (click)="cancel()" [disabled]="loading">Cancel</button>
      <button type="submit" class="hd-btn-primary" [disabled]="loading">
        {{ loading ? 'Saving…' : (isEditMode ? 'Update Category' : 'Create Category') }}
      </button>
    </div>
  </form>
</div>
