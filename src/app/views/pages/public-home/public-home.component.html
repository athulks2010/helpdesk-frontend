<div class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-slate-100">
  <header class="border-b border-slate-200 bg-white/80 backdrop-blur">
    <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img
          *ngIf="!logoFailed"
          [src]="settingService.logoUrl"
          [alt]="settingService.appName"
          class="h-9 w-auto max-w-[160px] object-contain"
          (error)="onLogoError($event)"
        />
        <ng-container *ngIf="logoFailed">
          <div class="h-9 w-9 rounded-lg bg-blue-600 text-white flex items-center justify-center font-bold">
            {{ settingService.appName.charAt(0) || 'H' }}
          </div>
          <span class="font-semibold text-slate-900">{{ settingService.appName }}</span>
        </ng-container>
      </div>
      <a routerLink="/auth/login" class="hd-btn-primary">Admin Sign In</a>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-6 py-20">
    <h1 class="text-4xl sm:text-5xl font-bold text-slate-900 tracking-tight max-w-2xl">
      Customer support that stays organized
    </h1>
    <p class="mt-4 text-lg text-slate-600 max-w-xl">
      Tickets, chat, knowledge base, and team workflows in one admin console.
    </p>
    <div class="mt-8 flex flex-wrap gap-3">
      <a routerLink="/auth/login" class="hd-btn-primary">Go to Admin</a>
      <a routerLink="/auth/register" class="hd-btn-secondary">Create account</a>
    </div>
  </main>
</div>
