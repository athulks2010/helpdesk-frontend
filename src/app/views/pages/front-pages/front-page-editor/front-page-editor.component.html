<div class="space-y-6">
  <div class="flex items-start justify-between gap-4 flex-wrap">
    <div class="flex flex-wrap gap-2">
      <a
        *ngFor="let p of pages"
        [routerLink]="['/front-pages', p]"
        class="px-3 py-1.5 text-sm rounded-lg border"
        [class.bg-blue-600]="p === pageKey"
        [class.text-white]="p === pageKey"
        [class.border-blue-600]="p === pageKey"
        [class.border-slate-200]="p !== pageKey"
        [class.text-slate-600]="p !== pageKey"
      >
        {{ pageLabels[p] }}
      </a>
    </div>
  </div>

  <div *ngIf="loading" class="hd-card p-10 text-center text-slate-500">Loading…</div>

  <form *ngIf="!loading" class="hd-card" [formGroup]="form" (ngSubmit)="save()">
    <div class="p-6 space-y-5">
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Title</label>
        <input type="text" class="hd-input" formControlName="title" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Content (HTML or JSON text)</label>
        <textarea class="hd-input min-h-[320px] font-mono text-sm" formControlName="content" rows="16"></textarea>
      </div>
    </div>

    <div *ngIf="error" class="px-6 pb-2 text-sm text-red-600">{{ error }}</div>
    <div *ngIf="success" class="px-6 pb-2 text-sm text-green-600">{{ success }}</div>

    <div class="px-6 py-4 bg-slate-50 dark:bg-slate-900/40 border-t border-slate-200 dark:border-slate-700 flex justify-end">
      <button type="submit" class="hd-btn-primary" [disabled]="saving">
        {{ saving ? 'Saving…' : 'Save Page' }}
      </button>
    </div>
  </form>
</div>
