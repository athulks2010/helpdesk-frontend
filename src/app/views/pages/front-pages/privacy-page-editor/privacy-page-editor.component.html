<div class="space-y-6">
  <div *ngIf="loading" class="hd-card p-10 text-center text-slate-500">Loading…</div>

  <div *ngIf="!loading"
    class="bg-white dark:bg-slate-800 rounded-md shadow overflow-hidden border border-slate-200 dark:border-slate-700">
    <div class="px-8 pt-6 pb-2 flex items-center justify-between gap-4 flex-wrap">
      <div>
        <h1 class="text-xl font-bold text-slate-900 dark:text-white">Privacy Policy Management</h1>
        <p class="mt-1 text-sm text-slate-500">Customize the public Privacy Policy page content</p>
      </div>
      <button type="button" (click)="previewPage()"
        class="inline-flex items-center px-4 py-2 text-sm font-medium text-slate-700 dark:text-slate-300 bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg hover:bg-slate-100 transition-colors">
        Preview
      </button>
    </div>

    <form (ngSubmit)="save()">
      <div class="p-8 -mr-6 -mb-8 flex flex-wrap">
        <div class="pr-6 pb-8 w-full lg:w-1/2">
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Title</label>
          <input type="text" class="hd-input" [(ngModel)]="htmlTitle" name="privacy_title" />
        </div>

        <div class="pr-6 pb-8 w-full">
          <label class="block text-sm font-bold text-slate-900 dark:text-white mb-2">Page Content:</label>
          <div class="rich-editor-wrapper">
            <div class="rich-editor-toolbar">
              <button type="button" (click)="triggerMediaManager()"
                class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-slate-700 dark:text-slate-200 bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded shadow-sm hover:bg-slate-50 dark:hover:bg-slate-600 cursor-pointer">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                    d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                    d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                Add Media
              </button>
            </div>
            <div class="editor-content-area">
              <textarea id="privacy-page-editor" class="w-full"></textarea>
            </div>
          </div>
        </div>
      </div>

      <div *ngIf="error" class="px-8 pb-2 text-sm text-red-600">{{ error }}</div>
      <div *ngIf="success" class="px-8 pb-2 text-sm text-green-600">{{ success }}</div>

      <div
        class="px-8 py-4 bg-gray-50 dark:bg-slate-900/40 border-t border-gray-100 dark:border-slate-700 flex items-center justify-between gap-3">
        <button type="submit" class="hd-btn-primary ml-auto" [disabled]="saving">
          {{ saving ? 'Saving…' : 'Save' }}
        </button>
      </div>
    </form>
  </div>
</div>
