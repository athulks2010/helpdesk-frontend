<div class="space-y-6">
  <div *ngIf="loading" class="hd-card p-10 text-center text-slate-500">Loading…</div>

  <div *ngIf="!loading"
    class="bg-white dark:bg-slate-800 rounded-md shadow overflow-hidden border border-slate-200 dark:border-slate-700">
    <form (ngSubmit)="save()">
      <div class="p-8 -mr-6 -mb-8 flex flex-wrap">
        <div class="w-full mx-auto">
          <!-- Tabs -->
          <div class="border-b border-gray-200 dark:border-gray-700">
            <ul class="flex flex-wrap -mb-px">
              <li *ngFor="let tab of tabs; let i = index" class="mr-2">
                <button type="button" (click)="setTab(i)"
                  class="inline-block rounded-t-lg py-4 px-4 text-sm text-center border-b-2 transition-colors"
                  [class.border-blue-500]="activeTab === i"
                  [class.text-blue-600]="activeTab === i"
                  [class.border-transparent]="activeTab !== i"
                  [class.text-gray-500]="activeTab !== i"
                  [class.hover:text-gray-600]="activeTab !== i"
                  [class.hover:border-gray-300]="activeTab !== i">
                  {{ tab }}
                </button>
              </li>
            </ul>
          </div>

          <!-- Content -->
          <div *ngIf="activeTab === 0" class="p-4">
            <div class="pr-6 pb-8 pt-5 w-full lg:w-1/3">
              <label class="block text-sm font-medium text-slate-500 mb-1">Text</label>
              <input type="text" class="hd-input" [(ngModel)]="html.content_text" name="content_text" />
            </div>
            <div class="pr-6 pb-8 w-full">
              <label class="block text-sm font-medium text-slate-900 dark:text-white mb-1">Details</label>
              <textarea class="hd-input" rows="4" [(ngModel)]="html.content_details" name="content_details"></textarea>
            </div>
          </div>

          <!-- Location -->
          <div *ngIf="activeTab === 1" class="p-4">
            <div class="pr-6 pb-8 pt-5 w-full">
              <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Location address</label>
              <input type="text" class="hd-input" [(ngModel)]="html.location" name="location" />
            </div>
            <div class="pr-6 pb-8 pt-5 w-full">
              <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Location map</label>
              <input type="text" class="hd-input" [(ngModel)]="html.location_map" name="location_map"
                placeholder="Embed URL or map iframe src" />
            </div>
          </div>

          <!-- Phone -->
          <div *ngIf="activeTab === 2" class="p-4">
            <div class="pr-6 pb-8 pt-5 w-full lg:w-1/3">
              <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Phone number</label>
              <input type="text" class="hd-input" [(ngModel)]="html.phone" name="phone" />
            </div>
            <div class="pr-6 pb-8 w-full">
              <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Details</label>
              <textarea class="hd-input" rows="4" [(ngModel)]="html.phone_details" name="phone_details"></textarea>
            </div>
          </div>

          <!-- Email -->
          <div *ngIf="activeTab === 3" class="p-4">
            <div class="pr-6 pb-8 pt-5 w-full lg:w-1/3">
              <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Email address</label>
              <input type="text" class="hd-input" [(ngModel)]="html.email" name="email" />
            </div>
            <div class="pr-6 pb-8 w-full">
              <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Email details</label>
              <textarea class="hd-input" rows="4" [(ngModel)]="html.email_details" name="email_details"></textarea>
            </div>
          </div>

          <!-- Contact Form -->
          <div *ngIf="activeTab === 4" class="p-4">
            <div class="pr-6 pb-8 pt-5 w-full lg:w-1/3">
              <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">
                Recipient Email (for the contact form)
              </label>
              <input type="email" class="hd-input" [(ngModel)]="html.contact_recipient" name="contact_recipient" />
            </div>
          </div>
        </div>
      </div>

      <div *ngIf="error" class="px-8 pb-2 text-sm text-red-600">{{ error }}</div>
      <div *ngIf="success" class="px-8 pb-2 text-sm text-green-600">{{ success }}</div>

      <div class="px-8 py-4 bg-gray-50 dark:bg-slate-900/40 border-t border-gray-100 dark:border-slate-700 flex items-center justify-between gap-3">
        <button type="submit" class="hd-btn-primary ml-auto" [disabled]="saving">
          {{ saving ? 'Saving…' : 'Save' }}
        </button>
      </div>
    </form>
  </div>
</div>
