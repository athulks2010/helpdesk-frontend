<div class="space-y-6">
  <div *ngIf="loading" class="hd-card p-10 text-center text-slate-500">Loading…</div>

  <div *ngIf="!loading" class="bg-white dark:bg-slate-800 rounded-md shadow overflow-hidden border border-slate-200 dark:border-slate-700">
   <form (ngSubmit)="save()">
      <div class="p-8 -mr-6 -mb-8 flex flex-wrap">
        <!-- Hero Section -->
        <h3 class="text-lg font-semibold mb-4 w-full text-slate-900 dark:text-white">Hero Section</h3>

        <div class="pr-6 pb-8 w-full lg:w-1/2">
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Badge text</label>
          <input type="text" class="hd-input" [(ngModel)]="html.hero.badge" name="hero_badge" />
        </div>
        <div class="pr-6 pb-8 w-full lg:w-1/2">
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Hero title</label>
          <input type="text" class="hd-input" [(ngModel)]="html.hero.title" name="hero_title" />
        </div>
        <div class="pr-6 pb-8 w-full">
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Hero subtitle</label>
          <textarea class="hd-input" rows="2" [(ngModel)]="html.hero.subtitle" name="hero_subtitle"></textarea>
        </div>
        <div class="pr-6 pb-8 w-full lg:w-1/2">
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Primary button text</label>
          <input type="text" class="hd-input" [(ngModel)]="html.hero.primary_button_text" name="hero_primary_text" />
        </div>
        <div class="pr-6 pb-8 w-full lg:w-1/2">
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Primary button link</label>
          <input type="text" class="hd-input" [(ngModel)]="html.hero.primary_button_link" name="hero_primary_link" />
        </div>
        <div class="pr-6 pb-8 w-full lg:w-1/2">
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Secondary button text</label>
          <input type="text" class="hd-input" [(ngModel)]="html.hero.secondary_button_text" name="hero_secondary_text" />
        </div>
        <div class="pr-6 pb-8 w-full lg:w-1/2">
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Secondary button link</label>
          <input type="text" class="hd-input" [(ngModel)]="html.hero.secondary_button_link" name="hero_secondary_link" />
        </div>
        <div class="pr-6 pb-8 w-full lg:w-1/3">
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Trust text 1</label>
          <input type="text" class="hd-input" [(ngModel)]="html.hero.trust_one" name="hero_trust_one" />
        </div>
        <div class="pr-6 pb-8 w-full lg:w-1/3">
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Trust text 2</label>
          <input type="text" class="hd-input" [(ngModel)]="html.hero.trust_two" name="hero_trust_two" />
        </div>
        <div class="pr-6 pb-8 w-full lg:w-1/3">
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Trust text 3</label>
          <input type="text" class="hd-input" [(ngModel)]="html.hero.trust_three" name="hero_trust_three" />
        </div>

        <!-- Services Section -->
        <h3 class="text-lg font-semibold mb-4 mt-2 w-full text-slate-900 dark:text-white">Services Section</h3>

        <div class="pr-6 pb-8 w-full lg:w-1/3">
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Section badge</label>
          <input type="text" class="hd-input" [(ngModel)]="html.services_section.badge" name="svc_badge" />
        </div>
        <div class="pr-6 pb-8 w-full lg:w-2/3">
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Section title</label>
          <input type="text" class="hd-input" [(ngModel)]="html.services_section.title" name="svc_title" />
        </div>
        <div class="pr-6 pb-8 w-full">
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Section subtitle</label>
          <textarea class="hd-input" rows="2" [(ngModel)]="html.services_section.subtitle" name="svc_subtitle"></textarea>
        </div>
        <div class="pr-6 pb-8 w-full lg:w-1/2">
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Card learn more text</label>
          <input type="text" class="hd-input" [(ngModel)]="html.services_section.learn_more_text" name="svc_learn_more" />
        </div>

        <!-- Bottom CTA Section -->
        <h3 class="text-lg font-semibold mb-4 mt-2 w-full text-slate-900 dark:text-white">Bottom CTA Section</h3>

        <div class="pr-6 pb-8 w-full">
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">CTA title</label>
          <input type="text" class="hd-input" [(ngModel)]="html.cta.title" name="cta_title" />
        </div>
        <div class="pr-6 pb-8 w-full">
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">CTA subtitle</label>
          <textarea class="hd-input" rows="2" [(ngModel)]="html.cta.subtitle" name="cta_subtitle"></textarea>
        </div>
        <div class="pr-6 pb-8 w-full lg:w-1/2">
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">CTA primary button text</label>
          <input type="text" class="hd-input" [(ngModel)]="html.cta.primary_button_text" name="cta_primary_text" />
        </div>
        <div class="pr-6 pb-8 w-full lg:w-1/2">
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">CTA primary button link</label>
          <input type="text" class="hd-input" [(ngModel)]="html.cta.primary_button_link" name="cta_primary_link" />
        </div>
        <div class="pr-6 pb-8 w-full lg:w-1/2">
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">CTA secondary button text</label>
          <input type="text" class="hd-input" [(ngModel)]="html.cta.secondary_button_text" name="cta_secondary_text" />
        </div>
        <div class="pr-6 pb-8 w-full lg:w-1/2">
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">CTA secondary button link</label>
          <input type="text" class="hd-input" [(ngModel)]="html.cta.secondary_button_link" name="cta_secondary_link" />
        </div>
      </div>

      <div *ngIf="error" class="px-8 pb-2 text-sm text-red-600">{{ error }}</div>
      <div *ngIf="success" class="px-8 pb-2 text-sm text-green-600">{{ success }}</div>

      <div class="px-8 py-4 bg-gray-50 dark:bg-slate-900/40 border-t border-gray-100 dark:border-slate-700 flex items-center justify-between gap-3">
       
        <button type="submit" class="hd-btn-primary ml-auto" [disabled]="saving">
          {{ saving ? 'Saving…' : 'Save' }}
        </button>
      </div>
    </form>
  </div>
</div>
