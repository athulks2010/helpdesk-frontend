<div *ngIf="loadingData"
  class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-10 text-center text-slate-500">
  Loading…
</div>

<!-- Form card -->
<form *ngIf="!loadingData" [formGroup]="form" (ngSubmit)="submit()"
  class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden">
    <div class="p-6 sm:p-8 space-y-6">
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
        <!-- Article Title -->
        <div class="lg:col-span-2">
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Article Title</label>
          <input type="text" formControlName="title" placeholder="Enter article title"
            class="w-full px-4 py-2.5 bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg text-sm text-slate-900 dark:text-white placeholder-slate-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200"
            [class.border-red-500]="hasError('title')" />
          <p *ngIf="hasError('title')" class="mt-1 text-xs text-red-600">Article Title is required</p>
        </div>

        <!-- Article Type -->
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">
            Article Type <span class="text-red-500">*</span>
          </label>
          <div class="relative">
            <select formControlName="type_id"
              class="w-full px-4 py-2.5 pr-10 bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg text-sm text-slate-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 appearance-none cursor-pointer"
              [class.border-red-500]="hasError('type_id')">
              <option [ngValue]="null">Select type</option>
              <option *ngFor="let s of types" [ngValue]="s.id || s._id">{{ s.name }}</option>
            </select>
            <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
              </svg>
            </div>
          </div>
          <p *ngIf="hasError('type_id')" class="mt-1 text-xs text-red-600">Article Type is required</p>
        </div>
      </div>

      <!-- Article Content -->
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Article Content</label>
        <div class="rich-editor-wrapper">
          <div class="rich-editor-toolbar">
            <button type="button" (click)="triggerMediaManager()"
              class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-slate-700 dark:text-slate-200 bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded shadow-sm hover:bg-slate-50 dark:hover:bg-slate-600 cursor-pointer">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
              </svg>
              Add Media
            </button>
          </div>
          <div class="editor-content-area">
            <textarea id="knowledge-base-editor" class="w-full"></textarea>
          </div>
        </div>
        <p *ngIf="hasError('details')" class="mt-1 text-xs text-red-600">Article Content is required</p>
      </div>
    </div>

    <div *ngIf="error" class="px-6 sm:px-8 pb-2 text-sm text-red-600">{{ error }}</div>

    <!-- Actions -->
    <div class="px-6 sm:px-8 py-5 flex items-center justify-between gap-3 border-t border-slate-200 dark:border-slate-700">
      <button *ngIf="isEditMode" type="button" (click)="remove()" [disabled]="deleting || loading"
        class="inline-flex items-center gap-1.5 px-4 py-2.5 rounded-lg bg-red-50 hover:bg-red-100 dark:bg-red-900/20 dark:hover:bg-red-900/40 text-red-600 dark:text-red-400 text-sm font-medium border border-red-200 dark:border-red-800 transition-colors disabled:opacity-50">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
        {{ deleting ? 'Deleting…' : 'Delete Article' }}
      </button>
      <span *ngIf="!isEditMode"></span>

      <button type="submit" [disabled]="loading || deleting"
        class="inline-flex items-center gap-1.5 px-5 py-2.5 rounded-lg bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white text-sm font-medium shadow-sm transition-colors disabled:opacity-50">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" />
        </svg>
        {{ loading ? 'Saving…' : (isEditMode ? 'Update Article' : 'Create Article') }}
      </button>
    </div>
  </form>
