<!-- Confirmation Dialog Modal Overlay -->
<div
  *ngIf="state.isOpen"
  (click)="onBackdropClick($event)"
  class="confirm-backdrop fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in"
  role="dialog"
  aria-modal="true"
  [attr.aria-labelledby]="'confirm-dialog-title'"
>
  <!-- Modal Card -->
  <div
    class="relative w-full max-w-md bg-white dark:bg-slate-800 rounded-2xl sm:rounded-3xl shadow-2xl border border-slate-100 dark:border-slate-700/80 p-6 sm:p-7 overflow-hidden text-center transform transition-all animate-scale-up"
    (click)="$event.stopPropagation()"
  >
    <!-- Close Button Top Right -->
    <button
      type="button"
      (click)="onCancel()"
      class="absolute top-4 right-4 p-1.5 rounded-xl text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors"
      aria-label="Close"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>

    <!-- Icon based on type -->
    <div class="flex justify-center mb-4">
      <!-- Danger (Default) -->
      <div
        *ngIf="!state.options.type || state.options.type === 'danger'"
        class="w-16 h-16 rounded-2xl bg-red-50 dark:bg-red-950/40 text-red-600 dark:text-red-400 border border-red-100 dark:border-red-900/30 flex items-center justify-center ring-8 ring-red-50/60 dark:ring-red-950/20 shadow-sm"
      >
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.8"
            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
          />
        </svg>
      </div>

      <!-- Warning -->
      <div
        *ngIf="state.options.type === 'warning'"
        class="w-16 h-16 rounded-2xl bg-amber-50 dark:bg-amber-950/40 text-amber-500 dark:text-amber-400 border border-amber-100 dark:border-amber-900/30 flex items-center justify-center ring-8 ring-amber-50/60 dark:ring-amber-950/20 shadow-sm"
      >
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.8"
            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
          />
        </svg>
      </div>

      <!-- Info -->
      <div
        *ngIf="state.options.type === 'info'"
        class="w-16 h-16 rounded-2xl bg-blue-50 dark:bg-blue-950/40 text-blue-500 dark:text-blue-400 border border-blue-100 dark:border-blue-900/30 flex items-center justify-center ring-8 ring-blue-50/60 dark:ring-blue-950/20 shadow-sm"
      >
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.8"
            d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
          />
        </svg>
      </div>
    </div>

    <!-- Title -->
    <h3 id="confirm-dialog-title" class="text-xl font-bold text-slate-900 dark:text-slate-100">
      {{ state.options.title || 'Confirm Action' }}
    </h3>

    <!-- Optional Item Highlight Badge -->
    <div *ngIf="state.options.itemName" class="mt-2.5">
      <span
        class="inline-block px-3 py-1 bg-slate-100 dark:bg-slate-700/70 border border-slate-200 dark:border-slate-600 rounded-lg text-xs font-semibold text-slate-800 dark:text-slate-200 max-w-full truncate shadow-sm"
        [title]="state.options.itemName"
      >
        {{ state.options.itemName }}
      </span>
    </div>

    <!-- Message Description -->
    <p class="mt-2.5 text-sm text-slate-500 dark:text-slate-400 leading-relaxed max-w-xs mx-auto">
      {{ state.options.message }}
    </p>

    <!-- Buttons -->
    <div class="mt-7 flex items-center justify-center gap-3">
      <!-- Cancel -->
      <button
        type="button"
        (click)="onCancel()"
        class="flex-1 px-4 py-2.5 rounded-xl font-semibold text-sm text-slate-700 dark:text-white bg-slate-100 dark:bg-slate-700/80 hover:bg-slate-200 dark:hover:bg-slate-600 transition-all active:scale-[0.98]"
      >
        {{ state.options.cancelText || 'Cancel' }}
      </button>

      <!-- Confirm / Delete Button (Red button with white text) -->
      <button
        type="button"
        (click)="onConfirm()"
        [ngClass]="{
          'bg-red-600 hover:bg-red-700 active:bg-red-800 text-white shadow-md shadow-red-500/30 hover:shadow-red-500/50':
            !state.options.type || state.options.type === 'danger',
          'bg-amber-600 hover:bg-amber-700 active:bg-amber-800 text-white shadow-md shadow-amber-500/30':
            state.options.type === 'warning',
          'bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white shadow-md shadow-blue-500/30':
            state.options.type === 'info'
        }"
        class="confirm-btn-action flex-1 px-5 py-2.5 rounded-xl font-bold text-sm text-white !text-white shadow-lg transition-all hover:scale-[1.02] active:scale-[0.98] flex items-center justify-center gap-2 cursor-pointer"
      >
        <svg *ngIf="!state.options.type || state.options.type === 'danger'" class="w-4 h-4 text-white !text-white shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
        <span class="text-white !text-white font-bold">{{ state.options.confirmText || 'Delete' }}</span>
      </button>
    </div>
  </div>
</div>
