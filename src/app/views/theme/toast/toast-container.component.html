<div class="fixed top-5 right-5 z-[9999] flex flex-col gap-3 max-w-sm w-[calc(100vw-2.5rem)] pointer-events-none" aria-live="polite">
  <div
    *ngFor="let toast of toasts; trackBy: trackById"
    class="pointer-events-auto w-full rounded-2xl p-4 shadow-xl border flex items-start gap-3.5 transition-all duration-300 animate-slide-in"
    [class.bg-white]="toast.type === 'success' || toast.type === 'info'"
    [class.dark:bg-slate-800]="toast.type === 'success' || toast.type === 'info'"
    [class.border-emerald-200]="toast.type === 'success'"
    [class.dark:border-emerald-800]="toast.type === 'success'"
    [class.shadow-emerald-500_10]="toast.type === 'success'"
    [class.bg-red-50]="toast.type === 'error'"
    [class.dark:bg-slate-800]="toast.type === 'error'"
    [class.border-red-200]="toast.type === 'error'"
    [class.dark:border-red-800]="toast.type === 'error'"
    [class.shadow-red-500_10]="toast.type === 'error'"
    [class.bg-amber-50]="toast.type === 'warning'"
    [class.dark:bg-slate-800]="toast.type === 'warning'"
    [class.border-amber-200]="toast.type === 'warning'"
    [class.dark:border-amber-800]="toast.type === 'warning'"
    [class.shadow-amber-500_10]="toast.type === 'warning'"
    [class.border-blue-200]="toast.type === 'info'"
    [class.dark:border-blue-800]="toast.type === 'info'"
    [class.shadow-blue-500_10]="toast.type === 'info'"
    role="alert"
  >
    <!-- Icon Container -->
    <div class="shrink-0 mt-0.5">
      <!-- Success Icon -->
      <span *ngIf="toast.type === 'success'" class="w-8 h-8 rounded-xl bg-emerald-100 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400 flex items-center justify-center shadow-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
        </svg>
      </span>

      <!-- Error Icon -->
      <span *ngIf="toast.type === 'error'" class="w-8 h-8 rounded-xl bg-red-100 dark:bg-red-950/60 text-red-600 dark:text-red-400 flex items-center justify-center shadow-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </span>

      <!-- Warning Icon -->
      <span *ngIf="toast.type === 'warning'" class="w-8 h-8 rounded-xl bg-amber-100 dark:bg-amber-950/60 text-amber-600 dark:text-amber-400 flex items-center justify-center shadow-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
      </span>

      <!-- Info Icon -->
      <span *ngIf="toast.type === 'info'" class="w-8 h-8 rounded-xl bg-blue-100 dark:bg-blue-900/40 text-blue-600 dark:text-blue-400 flex items-center justify-center shadow-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </span>
    </div>

    <!-- Content -->
    <div class="flex-1 min-w-0">
      <h4
        class="text-xs font-bold tracking-wide mb-0.5"
        [class.text-emerald-900]="toast.type === 'success'"
        [class.dark:text-emerald-200]="toast.type === 'success'"
        [class.text-red-900]="toast.type === 'error'"
        [class.dark:text-red-200]="toast.type === 'error'"
        [class.text-amber-900]="toast.type === 'warning'"
        [class.dark:text-amber-200]="toast.type === 'warning'"
        [class.text-slate-900]="toast.type === 'info'"
        [class.dark:text-white]="toast.type === 'info'"
      >
        {{ toast.title }}
      </h4>
      <p
        class="text-xs leading-relaxed break-words"
        [class.text-slate-600]="toast.type === 'success' || toast.type === 'info'"
        [class.dark:text-slate-300]="toast.type === 'success' || toast.type === 'info'"
        [class.text-red-700]="toast.type === 'error'"
        [class.dark:text-red-300]="toast.type === 'error'"
        [class.text-amber-800]="toast.type === 'warning'"
        [class.dark:text-amber-300]="toast.type === 'warning'"
      >
        {{ toast.message }}
      </p>
    </div>

    <!-- Close Button -->
    <button
      type="button"
      (click)="close(toast.id)"
      class="shrink-0 p-1 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors"
      aria-label="Close notification"
    >
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>
</div>
